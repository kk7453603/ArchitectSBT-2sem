spring.application.name=currency-rate-provider

# Spring Boot HTTP port (optional, useful for actuator and health checks)
server.port=8081

# gRPC server
grpc.server.port=9090
grpc.server.max-inbound-message-size=4194304

# ZooKeeper discovery registration
spring.cloud.zookeeper.connect-string=localhost:2181
spring.cloud.zookeeper.discovery.enabled=true
spring.cloud.zookeeper.discovery.register=true
spring.cloud.zookeeper.discovery.instance-port=${grpc.server.port}

# Logging
logging.level.root=INFO
logging.level.com.example.currencyprovider=DEBUG
logging.level.io.grpc=INFO
logging.level.net.devh.boot.grpc=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.main.allow-bean-definition-overriding=false

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# App version
app.version=1.0.0
