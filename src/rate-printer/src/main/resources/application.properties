spring.application.name=rate-printer
server.port=8082

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ZooKeeper discovery
spring.cloud.zookeeper.connect-string=${ZOOKEEPER_CONNECT_STRING:localhost:2181}
spring.cloud.zookeeper.discovery.enabled=true

# Provider discovery and gRPC call settings
rate.provider.service-name=currency-rate-provider
rate.printer.interval-ms=5000
rate.provider.rpc-timeout-ms=1500

# Logging — stdout only (12-factor: treat logs as event streams)
logging.level.root=INFO
logging.level.com.example.rateprinter=DEBUG
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%thread] %-5level %logger{36} - %msg%n

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# App version
app.version=1.0.0
