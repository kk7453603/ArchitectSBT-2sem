// Синтаксис proto3 (актуальная версия protobuf)
syntax = "proto3";

package com.example.currencyprovider;

// Опция для генерации Java классов в указанном пакете
option java_package = "com.example.currencyprovider.grpc";
option java_outer_classname = "CurrencyRateProto";
option java_multiple_files = true;

// Сервис CurrencyRateService предоставляет методы для получения курса валют
service CurrencyRateService {
    // Метод GetRate возвращает текущий курс USDRUB
    // Принимает пустой запрос, возвращает CurrencyRateResponse
    rpc GetRate (EmptyRequest) returns (CurrencyRateResponse);
}

// Пустой запрос (для методов без параметров)
message EmptyRequest {
}

// Сообщение ответа с курсом валюты
message CurrencyRateResponse {
    // Курс USDRUB с случайным отклонением
    double rate = 1;
    
    // Временная метка запроса в миллисекундах с epoch
    int64 timestamp = 2;
}
