global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'service1'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          instance: 'service1'

  - job_name: 'service2'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          instance: 'service2'

  - job_name: 'client'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          instance: 'client'

  - job_name: 'zookeeper'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:7000']
        labels:
          instance: 'zookeeper'
