services:
  postgres:
    image: postgres:16
    container_name: pact-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    volumes:
      - pact-postgres-data:/var/lib/postgresql/data

  pact-broker:
    image: pactfoundation/pact-broker
    container_name: pact-broker
    restart: unless-stopped
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@postgres/pact
      PACT_BROKER_BASIC_AUTH_USERNAME: pact
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact
    depends_on:
      - postgres

volumes:
  pact-postgres-data:
