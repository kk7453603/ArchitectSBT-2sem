name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build proto module
        run: |
          cd src
          mvn -B clean install -pl currency-rate-proto

      - name: Test and verify currency-rate-provider
        run: |
          cd src/currency-rate-provider
          mvn -B clean verify

      - name: Test and verify rate-printer
        run: |
          cd src/rate-printer
          mvn -B clean verify

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build currency-rate-provider image
        run: |
          cd src
          docker build -f currency-rate-provider/Dockerfile -t currency-rate-provider:latest .

      - name: Build rate-printer image
        run: |
          cd src
          docker build -f rate-printer/Dockerfile -t rate-printer:latest .
